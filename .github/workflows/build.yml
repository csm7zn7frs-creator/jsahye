name: Build Tweak
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/theos/theos:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: make clean package
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tweak-deb
          path: packages/*.deb



