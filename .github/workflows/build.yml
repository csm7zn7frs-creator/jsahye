name: Build RootHide Tweak
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Tweak with Theos
        uses: theos/setup-theos@v1
        with:
          package-scheme: roothide

      - name: Compile
        run: make clean package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: tweak-deb
          path: packages/*.deb


